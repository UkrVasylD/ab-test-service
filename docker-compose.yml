services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abtest
      POSTGRES_USER: abtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abtest}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abtest -d abtest"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://abtest:${POSTGRES_PASSWORD:-abtest}@db:5432/abtest
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-change-me}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: